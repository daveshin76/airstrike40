<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Shooter - Text Fixed</title>
    <style>
        body { margin: 0; background: #050810; overflow: hidden; font-family: 'Pretendard', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { position: absolute; padding: 15px; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px #000; }
        #score-board { top: 5px; left: 10px; color: #f1c40f; }
        #life-board { top: 5px; right: 10px; font-size: 18px; color: #ff4757; letter-spacing: 1px; }
        #question-area { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 95%; text-align: center; }
        #en-text { 
            font-size: 26px; font-weight: 900; color: #fff; background: rgba(0, 110, 255, 0.95); 
            padding: 12px 18px; border-radius: 15px; display: inline-block; border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); word-break: keep-all; line-height: 1.2;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; padding: 30px; border-radius: 20px; text-align: center; display: none; pointer-events: auto; width: 75%;
        }
        button { padding: 15px 30px; font-size: 22px; background: #007aff; color: #fff; border: none; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div id="score-board" class="hud">SCORE: 0</div>
    <div id="life-board" class="hud">❤❤❤❤❤</div>
    <div id="question-area"><div id="en-text">READY?</div></div>
    <div id="game-over">
        <h1 style="color:#333; margin-top:0;">GAME OVER</h1>
        <p id="final-stats" style="font-size: 20px; color: #666; margin-bottom:20px;"></p>
        <button onclick="location.reload()">다시 시작</button>
    </div>
</div>

<script>
const phraseData = [
   { "en": "attribute A to B", "ko": "A를 B의 탓(덕분)으로 돌리다" },
  { "en": "ascribe A to B", "ko": "A를 B의 결과로 여기다" },
  { "en": "distinguish A from B", "ko": "A와 B를 구별하다" },
  { "en": "differentiate A from B", "ko": "A를 B와 차별화하다" },
  { "en": "keep A from -ing", "ko": "A가 ~하는 것을 막다/방해하다" },
  { "en": "prevent A from -ing", "ko": "A가 ~하지 못하게 예방하다" },
  { "en": "prohibit A from -ing", "ko": "A가 ~하는 것을 금지하다" },
  { "en": "take A into account", "ko": "A를 고려하다" },
  { "en": "take A for granted", "ko": "A를 당연하게 여기다" },
  { "en": "provide A with B", "ko": "A에게 B를 제공하다" },
  { "en": "present A with B", "ko": "A에게 B를 제시/증정하다" },
  { "en": "devote A to B", "ko": "A를 B에 바치다/전념하다" },
  { "en": "commit oneself to N", "ko": "~에 전념하다/약속하다" },
  { "en": "remind A of B", "ko": "A에게 B를 상기시키다" },
  { "en": "inform A of B", "ko": "A에게 B를 알리다" },
  { "en": "accuse A of B", "ko": "A를 B의 혐의로 비난/고발하다" },
  { "en": "deprive A of B", "ko": "A에게서 B를 박탈하다" },
  { "en": "rob A of B", "ko": "A에게서 B를 강탈하다" },
  { "en": "replace A with B", "ko": "A를 B로 교체하다" },
  { "en": "substitute A for B", "ko": "B 대신 A를 쓰다 (A로 대체하다)" },
  { "en": "refer to A as B", "ko": "A를 B라고 부르다/언급하다" },
  { "en": "regard A as B", "ko": "A를 B로 간주하다" },
  { "en": "view A as B", "ko": "A를 B라고 보다" },
  { "en": "transform A into B", "ko": "A를 B로 변형시키다" },
  { "en": "translate A into B", "ko": "A를 B로 번역/해석하다" },
  { "en": "impose A on B", "ko": "A를 B에게 부과/강요하다" },
  { "en": "congratulate A on B", "ko": "A에게 B에 대해 축하하다" },
  { "en": "base A on B", "ko": "A를 B에 근거를 두다" },
  { "en": "blame A for B", "ko": "B에 대해 A를 비난하다" },
  { "en": "exchange A for B", "ko": "A를 B와 교환하다" },
  { "en": "mistake A for B", "ko": "A를 B로 오해/착각하다" },
  { "en": "warn A of B", "ko": "A에게 B를 경고하다" },
  { "en": "protect A from B", "ko": "A를 B로부터 보호하다" },
  { "en": "derive A from B", "ko": "B에서 A를 이끌어내다/유래하다" },
  { "en": "owe A to B", "ko": "A는 B 덕분이다" },
  { "en": "relieve A of B", "ko": "A에게서 B(부담 등)를 덜어주다" },
  { "en": "clear A of B", "ko": "A에게서 B(혐의 등)를 벗겨주다" },
  { "en": "share A with B", "ko": "A를 B와 공유하다" },
  { "en": "associate A with B", "ko": "A를 B와 연관시키다" },
  { "en": "identify A with B", "ko": "A와 B를 동일시하다" },
  { "en": "equate A with B", "ko": "A와 B를 동등하게 생각하다" },
  { "en": "charge A with B", "ko": "A를 B의 혐의로 기소/책임을 맡기다" },
  { "en": "compare A to B", "ko": "A를 B에 비유하다" },
  { "en": "compare A with B", "ko": "A와 B를 비교하다" },
  { "en": "adapt A to B", "ko": "A를 B에 적응/맞추다" },
  { "en": "attach A to B", "ko": "A를 B에 붙이다/첨부하다" },
  { "en": "confine A to B", "ko": "A를 B에 국한시키다/가두다" },
  { "en": "entitle A to B", "ko": "A에게 B의 자격을 주다" },
  { "en": "expose A to B", "ko": "A를 B에 노출시키다" },
  { "en": "add A to B", "ko": "A를 B에 더하다" },
  { "en": "depend on / rely on", "ko": "~에 의존하다/달려있다" },
  { "en": "count on", "ko": "~을 믿다/기대다" },
  { "en": "resort to N", "ko": "(최후의 수단으로) ~에 호소하다" },
  { "en": "contribute to N", "ko": "~에 기여하다/원인이 되다" },
  { "en": "lead to N", "ko": "~로 이어지다/야기하다" },
  { "en": "result in", "ko": "~한 결과를 낳다" },
  { "en": "result from", "ko": "~에서 기인하다 (원인)" },
  { "en": "consist of", "ko": "~로 구성되다" },
  { "en": "consist in", "ko": "~에 (본질이) 있다" },
  { "en": "comply with", "ko": "~을 준수하다/따르다" },
  { "en": "conform to", "ko": "~에 순응하다/일치하다" },
  { "en": "interfere with", "ko": "~을 방해하다/간섭하다" },
  { "en": "cope with / deal with", "ko": "~에 대처하다/다루다" },
  { "en": "object to -ing/N", "ko": "~에 반대하다" },
  { "en": "participate in", "ko": "~에 참여하다" },
  { "en": "specialize in", "ko": "~을 전문으로 하다" },
  { "en": "succeed in", "ko": "~에 성공하다" },
  { "en": "succeed to N", "ko": "~을 계승하다" },
  { "en": "apologize to A for B", "ko": "A에게 B에 대해 사과하다" },
  { "en": "belong to N", "ko": "~에 속하다" },
  { "en": "respond to / react to", "ko": "~에 반응하다/응답하다" },
  { "en": "subscribe to N", "ko": "~을 구독하다/동의하다" },
  { "en": "accustom oneself to N", "ko": "~에 익숙해지다" },
  { "en": "amount to N", "ko": "(합계가) ~에 이르다 / ~와 마찬가지다" },
  { "en": "appeal to N", "ko": "~에 호소하다 / 매력이 있다" },
  { "en": "apply for", "ko": "~에 지원/신청하다" },
  { "en": "apply to N", "ko": "~에 적용되다" },
  { "en": "care for", "ko": "~을 돌보다 / 좋아하다" },
  { "en": "complain about", "ko": "~에 대해 불평하다" },
  { "en": "concentrate on / focus on", "ko": "~에 집중하다" },
  { "en": "coincide with", "ko": "~와 동시에 일어나다/일치하다" },
  { "en": "collide with", "ko": "~와 충돌하다" },
  { "en": "depart from", "ko": "~에서 떠나다/벗어나다" },
  { "en": "dispose of", "ko": "~을 처분하다/제거하다" },
  { "en": "emerge from", "ko": "~에서 나타나다/벗어나다" },
  { "en": "experiment with", "ko": "~으로 실험하다" },
  { "en": "graduate from", "ko": "~을 졸업하다" },
  { "en": "insist on", "ko": "~을 주장하다/고집하다" },
  { "en": "listen to N", "ko": "~을 경청하다" },
  { "en": "long for", "ko": "~을 갈망하다" },
  { "en": "look at", "ko": "~을 보다" },
  { "en": "look for", "ko": "~을 찾다" },
  { "en": "look into", "ko": "~을 조사하다" },
  { "en": "pay for", "ko": "~에 대한 대가를 지불하다" },
  { "en": "persist in", "ko": "~을 고집하다/지속하다" },
  { "en": "prepare for", "ko": "~을 준비하다" },
  { "en": "profit from", "ko": "~에서 이익을 얻다" },
  { "en": "refrain from -ing", "ko": "~을 삼가다/그만두다" },
  { "en": "strive for", "ko": "~을 위해 노력하다" },
  { "en": "wait for", "ko": "~을 기다리다" }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let score = 0, life = 5, gameActive = true, currentQuestion = null;
let enemies = [], particles = [], stars = [];
let player = { x: w / 2, y: h - 110, targetX: w / 2, tilt: 0, recoil: 0 };

for(let i=0; i<20; i++) stars.push({ x: Math.random()*w, y: Math.random()*h, s: Math.random()*2+1 });

class Enemy {
    constructor(text, isCorrect, xPos) {
        this.text = text; this.isCorrect = isCorrect;
        this.x = xPos; this.y = -150;
        this.w = w * 0.3; // 박스 너비 살짝 확대
        this.h = 95;      // 박스 높이 확대
        this.speed = 2.3 + (score / 200);
    }

    // 텍스트 줄바꿈 함수
    wrapText(context, text, maxWidth) {
        let words = text.split(" ");
        let lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
            let word = words[i];
            let width = context.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);
        return lines;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = "#fff";
        
        // 기체 몸체
        ctx.beginPath(); ctx.roundRect(-this.w/2, 0, this.w, this.h, 12); ctx.fill();
        // 바퀴/날개 장식
        ctx.fillStyle = "#dfe6e9";
        ctx.beginPath(); ctx.ellipse(-this.w/2, 20, 8, 20, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(this.w/2, 20, 8, 20, 0, 0, Math.PI*2); ctx.fill();

        // 텍스트 그리기
        ctx.textAlign = "center";
        let fontSize = 18;
        if(this.text.length > 10) fontSize = 15; // 글자 많으면 폰트 축소
        
        ctx.font = `bold ${fontSize}px Pretendard`;
        ctx.fillStyle = "#000";

        const lines = this.wrapText(ctx, this.text, this.w - 15);
        const lineHeight = fontSize + 4;
        const startY = (this.h / 2) - ((lines.length - 1) * lineHeight / 2) + 5;

        lines.forEach((line, i) => {
            ctx.fillText(line, 0, startY + (i * lineHeight));
        });

        ctx.restore();
    }
    update() { this.y += this.speed; }
}

function spawn() {
    if(!gameActive) return;
    currentQuestion = phraseData[Math.floor(Math.random() * phraseData.length)];
    document.getElementById('en-text').innerText = currentQuestion.en;
    
    let others = phraseData.filter(item => item.ko !== currentQuestion.ko);
    others.sort(() => Math.random() - 0.5);
    
    let opts = [
        { text: currentQuestion.ko, isCorrect: true },
        { text: others[0].ko, isCorrect: false },
        { text: others[1].ko, isCorrect: false }
    ];
    opts.sort(() => Math.random() - 0.5);

    enemies = [];
    const sectors = [w * 0.18, w * 0.5, w * 0.82];
    opts.forEach((opt, i) => {
        enemies.push(new Enemy(opt.text, opt.isCorrect, sectors[i]));
    });
}

function loop() {
    if(!gameActive) return;
    ctx.fillStyle = "#050810"; ctx.fillRect(0,0,w,h);
    
    stars.forEach(s => {
        ctx.fillStyle = "#ffffff33";
        ctx.fillRect(s.x, s.y, 2, 2);
        s.y += s.s * 5; if(s.y > h) s.y = -5;
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.l -= 0.03;
        ctx.globalAlpha = p.l; ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, 5, 5);
        if(p.l <= 0) particles.splice(i,1);
    });
    ctx.globalAlpha = 1;

    for(let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.update(); en.draw();
        if(en.y > h) {
            if(en.isCorrect) { life--; updateUI(); if(life > 0) spawn(); }
            enemies.splice(i, 1);
            if(enemies.length === 0 && gameActive) spawn();
        }
    }

    let moveDiff = player.targetX - player.x;
    player.tilt = moveDiff * 0.06;
    player.x += moveDiff * 0.2;
    if(player.recoil > 0) player.recoil -= 2;

    ctx.save();
    ctx.translate(player.x, player.y + player.recoil);
    ctx.rotate(player.tilt * Math.PI / 180);
    ctx.fillStyle = "#007aff";
    ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(-30, 20); ctx.lineTo(30, 20); ctx.fill();
    ctx.fillStyle = "#55aaff"; ctx.fillRect(-45, 0, 90, 8);
    ctx.fillStyle = Math.random() > 0.5 ? "#ffae00" : "#ff4400";
    ctx.fillRect(-10, 20, 20, 15);
    ctx.restore();

    if(life <= 0) {
        gameActive = false;
        document.getElementById('game-over').style.display = 'block';
        document.getElementById('final-stats').innerText = `SCORE: ${score}`;
    } else { requestAnimationFrame(loop); }
}

function updateUI() {
    document.getElementById('score-board').innerText = "SCORE: " + score;
    document.getElementById('life-board').innerText = "❤".repeat(Math.max(0, life));
}

function handleInput(ex, ey) {
    if(!gameActive) return;
    player.targetX = ex;
    player.recoil = 15;
    for(let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        if(ex > en.x - en.w/2 - 20 && ex < en.x + en.w/2 + 20 && ey > en.y && ey < en.y + en.h + 30) {
            if(en.isCorrect) {
                score += 10;
                for(let j=0; j<15; j++) particles.push({x:en.x, y:en.y+40, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, l:1, c:"#f1c40f"});
                updateUI(); spawn();
            } else {
                life--;
                for(let j=0; j<15; j++) particles.push({x:en.x, y:en.y+40, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, l:1, c:"#ff4757"});
                updateUI(); enemies.splice(i, 1);
                if(enemies.length === 0) spawn();
            }
            break;
        }
    }
}

canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; handleInput(t.clientX, t.clientY);
    e.preventDefault();
}, {passive: false});
canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
window.addEventListener('mousemove', (e) => { player.targetX = e.clientX; });

spawn();
loop();
</script>
</body>
</html>
